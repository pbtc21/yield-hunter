[project]
name = "yield-hunter"
description = "Autonomous yield-hunting AI agent for AIBTC"
authors = ["AIBTC <dev@aibtc.dev>"]
telemetry = false
cache_dir = "./.cache"

# Core contracts
[contracts.yield-hunter]
path = "contracts/yield-hunter/yield-hunter.clar"

[contracts.yield-hunter-adapter]
path = "contracts/yield-hunter/yield-hunter-adapter.clar"

[contracts.yield-hunter-oracle]
path = "contracts/yield-hunter/yield-hunter-oracle.clar"

[contracts.agent-lifecycle]
path = "contracts/yield-hunter/agent-lifecycle.clar"

# Adapter trait
[contracts.adapter-trait]
path = "contracts/yield-hunter/adapter-trait.clar"

# Protocol adapters
[contracts.bitflow-adapter]
path = "contracts/yield-hunter/bitflow-adapter.clar"

[contracts.alex-adapter]
path = "contracts/yield-hunter/alex-adapter.clar"

[contracts.hermetica-adapter]
path = "contracts/yield-hunter/hermetica-adapter.clar"

[contracts.zest-adapter]
path = "contracts/yield-hunter/zest-adapter.clar"

[contracts.arkadiko-adapter]
path = "contracts/yield-hunter/arkadiko-adapter.clar"

# External contract references (deployed on mainnet/testnet)
[contracts.sbtc-token]
path = "contracts/external/sbtc-token.clar"

[contracts.xyk-pool-trait]
path = "contracts/external/xyk-pool-trait.clar"

[contracts.sip-010-trait]
path = "contracts/external/sip-010-trait.clar"

[repl.analysis]
passes = ["check_checker"]
check_checker = { trusted_sender = false, trusted_caller = false, callee_filter = false }
